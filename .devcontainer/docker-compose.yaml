services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: joomla_db
      MYSQL_USER: joomla_user
      MYSQL_PASSWORD: joomla_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  joomla:
    image: joomla:latest
    ports:
      - "8080:80"
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_USER: joomla_user
      JOOMLA_DB_PASSWORD: joomla_password
      JOOMLA_DB_NAME: joomla_db
    volumes:
      - joomla_files:/var/www/html
      - ./scripts/auto_install.sh:/usr/local/bin/auto_install.sh
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "/usr/local/bin/auto_install.sh"]

  mcp-server:
    build: 
      context: ..
      dockerfile: mcp-server/Dockerfile
    environment:
      DB_HOST: db
      DB_USER: joomla_user
      DB_PASSWORD: joomla_password
      DB_NAME: joomla_db
      DB_PREFIX: "jos_" # Joomla di solito usa jos_ o quello che definisci
      JOOMLA_API_BASE: "http://joomla/api/index.php/v1"
      JOOMLA_API_TOKEN: "IL_TUO_TOKEN_QUI" # Non dimenticare di generarlo in Joomla
    volumes:
      - ..:/workspaces/joomla-mcp-suite:cached
      - joomla_files:/var/www/html
    command: sleep infinity
    stdin_open: true
    tty: true
    depends_on:
      - joomla

volumes:
  joomla_files:
